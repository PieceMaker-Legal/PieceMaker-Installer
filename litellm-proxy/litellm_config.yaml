# PieceMaker — configuration du proxy LiteLLM
#
# Le travail PII est fait par le middleware ASGI (piecemaker_pii/asgi.py).
# PieceMaker n'ajoute aucun modele ni fournisseur. Le pass-through Anthropic
# natif de LiteLLM reste donc disponible sur /anthropic/v1/messages et conserve
# l'authentification du client (notamment Claude Pro/Max).
#
# Pour utiliser une configuration LiteLLM existante, definir simplement :
#   LITELLM_CONFIG_PATH=/chemin/vers/config.yaml

general_settings:
  forward_client_headers_to_llm_api: true

litellm_settings:
  drop_params: true
  set_verbose: false
