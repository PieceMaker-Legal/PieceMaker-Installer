<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006c62">
  <title>PieceMaker — Serveur arrêté</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3f7f6; color: #172226; }
    main { width: min(520px, calc(100% - 32px)); border: 1px solid #dce4e3; border-radius: 18px; background: white; padding: 34px; box-shadow: 0 18px 60px rgba(21, 43, 39, .12); text-align: center; }
    img { width: 88px; height: 88px; border-radius: 18px; }
    h1 { margin: 22px 0 10px; font-size: 1.5rem; }
    p { margin: 0 0 22px; color: #66757b; line-height: 1.55; }
    .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border-radius: 9px; background: #006c62; padding: 0 18px; color: white; font-weight: 750; text-decoration: none; }
    .command { margin-top: 20px; font-size: .82rem; }
    code { border-radius: 5px; background: #edf1ef; padding: 3px 6px; color: #27423d; }
    #state { min-height: 1.5em; margin-top: 16px; color: #006c62; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>Le serveur PieceMaker est arrêté</h1>
    <p>Démarrez le serveur local. Cette fenêtre rouvrira automatiquement l’administration dès qu’il répondra.</p>
    <a id="startServer" class="button" href="piecemaker://start">Démarrer PieceMaker</a>
    <div id="state" role="status" aria-live="polite"></div>
    <p class="command">En cas de besoin, lancez <code>piecemaker start</code> dans le terminal.</p>
  </main>
  <script>
    const state = document.getElementById('state');
    document.getElementById('startServer').addEventListener('click', () => {
      state.textContent = 'Démarrage en cours…';
    });
    setInterval(async () => {
      try {
        const response = await fetch('/health', { cache: 'no-store' });
        if (response.ok) location.replace('/admin/');
      } catch {}
    }, 1200);
  </script>
</body>
</html>
